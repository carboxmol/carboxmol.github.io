<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Glass Glow -->
    <linearGradient id="glassGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Carbox Cyan Glow -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- CarboxMol Purple Glow -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#dropGlow)"/>
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="url(#glassGlow)" stroke-width="4"/>

  <!-- Open Documentation Pages / Folio Book Base -->
  <path d="M 88 356 C 140 330 208 334 256 364 C 304 334 372 330 424 356 L 424 180 C 372 154 304 158 256 188 C 208 158 140 154 88 180 Z" 
        fill="#0f172a" fill-opacity="0.82" stroke="#38bdf8" stroke-width="6" stroke-linejoin="round"/>

  <!-- Book Spine Center Divider -->
  <path d="M 256 188 L 256 364" stroke="#c084fc" stroke-width="6" stroke-linecap="round"/>

  <!-- Left Side: Carbox Crystallographic Dyad & Hydrogen Bond -->
  <!-- Oxygen 1 -->
  <circle cx="160" cy="246" r="28" fill="url(#cyanGrad)"/>
  <circle cx="160" cy="246" r="14" fill="#ffffff" fill-opacity="0.9"/>
  <!-- Oxygen 2 -->
  <circle cx="216" cy="292" r="24" fill="url(#cyanGrad)"/>
  <!-- Low-Barrier Hydrogen Bond (Dashed Proton Vector) -->
  <line x1="160" y1="246" x2="216" y2="292" stroke="#ffffff" stroke-width="6" stroke-dasharray="8 6" stroke-linecap="round"/>
  <!-- Quantum Proton in Center -->
  <circle cx="188" cy="269" r="10" fill="#facc15"/>

  <!-- Right Side: CarboxMol 3D Molecular Coordination Polyhedron -->
  <!-- Central Metal/Carbon -->
  <polygon points="352,210 404,242 404,302 352,334 300,302 300,242" 
           fill="none" stroke="url(#purpleGrad)" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="352" cy="272" r="22" fill="url(#purpleGrad)"/>
  <circle cx="352" cy="272" r="10" fill="#ffffff"/>
  <!-- Vertex Atoms -->
  <circle cx="352" cy="210" r="12" fill="#38bdf8"/>
  <circle cx="404" cy="242" r="12" fill="#34d399"/>
  <circle cx="404" cy="302" r="12" fill="#f472b6"/>
  <circle cx="352" cy="334" r="12" fill="#38bdf8"/>
  <circle cx="300" cy="302" r="12" fill="#fb923c"/>
  <circle cx="300" cy="242" r="12" fill="#34d399"/>
  <!-- Internal Coordination Lines -->
  <line x1="352" y1="272" x2="352" y2="210" stroke="#c084fc" stroke-width="4"/>
  <line x1="352" y1="272" x2="404" y2="242" stroke="#c084fc" stroke-width="4"/>
  <line x1="352" y1="272" x2="404" y2="302" stroke="#c084fc" stroke-width="4"/>
  <line x1="352" y1="272" x2="352" y2="334" stroke="#c084fc" stroke-width="4"/>
  <line x1="352" y1="272" x2="300" y2="302" stroke="#c084fc" stroke-width="4"/>
  <line x1="352" y1="272" x2="300" y2="242" stroke="#c084fc" stroke-width="4"/>

  <!-- Top Ribbon Banner: "DOCS" Badge -->
  <rect x="186" y="96" width="140" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
  <text x="256" y="124" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="3">DOCS</text>

  <!-- Bottom Release Label: "2026" -->
  <text x="256" y="424" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="22" fill="#e2e8f0" text-anchor="middle" letter-spacing="4">RELEASE 2026</text>
</svg>

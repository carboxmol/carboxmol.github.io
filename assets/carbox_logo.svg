<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0c192c" />
      <stop offset="60%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#02050b" />
    </radialGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="strong-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="44" fill="url(#bg)" stroke="#1e293b" stroke-width="2" />

  <!-- Coordinate Grid & Geometry Lines -->
  <g stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8">
    <line x1="60" y1="160" x2="340" y2="160" />
    <line x1="200" y1="50" x2="200" y2="270" />
    <circle cx="200" cy="160" r="90" fill="none" />
    <circle cx="200" cy="160" r="130" fill="none" stroke-opacity="0.4" />
  </g>

  <!-- Left Carboxyl (Cyan Residue) -->
  <g transform="translate(130, 160)">
    <!-- Density contour mesh -->
    <path d="M-50,-40 C-20,-60, 20,-40, 20,-10 C20,10, 40,20, 20,40 C0,60, -40,50, -50,20 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
    <!-- Atoms & Bonds -->
    <line x1="-30" y1="-20" x2="0" y2="0" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <line x1="-30" y1="20" x2="0" y2="0" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <circle cx="-30" cy="-20" r="8" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="-30" cy="20" r="8" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="0" cy="0" r="10" fill="#0284c7" filter="url(#glow)" />
    <circle cx="0" cy="0" r="5" fill="#e0f2fe" />
    <!-- Oxygen -->
    <line x1="0" y1="0" x2="35" y2="0" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <circle cx="35" cy="0" r="9" fill="#ef4444" filter="url(#glow)" />
  </g>

  <!-- Right Carboxyl (Amber Residue) -->
  <g transform="translate(270, 160)">
    <!-- Density contour mesh -->
    <path d="M50,-40 C20,-60, -20,-40, -20,-10 C-20,10, -40,20, -20,40 C0,60, 40,50, 50,20 Z" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.4" />
    <!-- Atoms & Bonds -->
    <line x1="30" y1="-20" x2="0" y2="0" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <line x1="30" y1="20" x2="0" y2="0" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <circle cx="30" cy="-20" r="8" fill="#fbbf24" filter="url(#glow)" />
    <circle cx="30" cy="20" r="8" fill="#fbbf24" filter="url(#glow)" />
    <circle cx="0" cy="0" r="10" fill="#d97706" filter="url(#glow)" />
    <circle cx="0" cy="0" r="5" fill="#fef3c7" />
    <!-- Oxygen -->
    <line x1="0" y1="0" x2="-35" y2="0" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <circle cx="-35" cy="0" r="9" fill="#ef4444" filter="url(#glow)" />
  </g>

  <!-- Central Low-Barrier Hydrogen Bond (LBHB O···H···O) -->
  <g transform="translate(200, 160)">
    <line x1="-35" y1="0" x2="35" y2="0" stroke="#fef08a" stroke-width="4" stroke-dasharray="4 3" filter="url(#strong-glow)" />
    <circle cx="0" cy="0" r="16" fill="#f59e0b" filter="url(#strong-glow)" />
    <circle cx="0" cy="0" r="10" fill="#ffffff" filter="url(#glow)" />
    <text x="0" y="4" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="900" fill="#0f172a" text-anchor="middle">H⁺</text>
  </g>

  <!-- CARBOX Typography -->
  <g transform="translate(200, 330)">
    <text x="-65" y="0" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="3" fill="url(#cyan-grad)" filter="url(#glow)">CAR</text>
    <text x="45" y="0" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="3" fill="url(#amber-grad)" filter="url(#glow)">BOX</text>
  </g>
</svg>

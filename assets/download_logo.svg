<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient: Emerald & Sky Cyan to Violet -->
    <linearGradient id="dlBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Glass Rim -->
    <linearGradient id="dlGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="dlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#dlBgGrad)" filter="url(#dlGlow)"/>
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="url(#dlGlass)" stroke-width="4"/>

  <!-- Molecular Hexagonal Crystal Cage -->
  <polygon points="256,96 376,165 376,303 256,372 136,303 136,165" 
           fill="#0f172a" fill-opacity="0.75" stroke="#38bdf8" stroke-width="6" stroke-linejoin="round"/>

  <!-- Molecular Vertex Nodes -->
  <circle cx="256" cy="96" r="14" fill="#34d399"/>
  <circle cx="376" cy="165" r="14" fill="#38bdf8"/>
  <circle cx="376" cy="303" r="14" fill="#c084fc"/>
  <circle cx="256" cy="372" r="14" fill="#34d399"/>
  <circle cx="136" cy="303" r="14" fill="#c084fc"/>
  <circle cx="136" cy="165" r="14" fill="#38bdf8"/>

  <!-- Large Bold Center Download Arrow -->
  <!-- Shaft -->
  <path d="M 232 150 L 280 150 L 280 250 L 324 250 L 256 326 L 188 250 L 232 250 Z" 
        fill="url(#arrowGrad)" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>

  <!-- Download Tray / Baseline -->
  <path d="M 180 340 L 332 340" stroke="#34d399" stroke-width="12" stroke-linecap="round"/>
  <path d="M 180 340 L 180 324" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>
  <path d="M 332 340 L 332 324" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>

  <!-- Top Release Ribbon: "RELEASES" -->
  <rect x="176" y="52" width="160" height="38" rx="19" fill="#0f172a" stroke="#34d399" stroke-width="3"/>
  <text x="256" y="77" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="16" fill="#34d399" text-anchor="middle" letter-spacing="3">DOWNLOADS</text>

  <!-- Bottom Release Label: "WHEEL · BINARY · CIF" -->
  <text x="256" y="432" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="18" fill="#e2e8f0" text-anchor="middle" letter-spacing="3">RELEASE 2026</text>
</svg>
